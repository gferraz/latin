name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: gem install slim --no-document

      - name: Run tests
        run: ruby test/declinationes_test.rb

      - name: Build
        run: ruby build.rb

      # Pages serves index.html at the site root; the tracked artifacts keep
      # their descriptive names, so the copies happen only for deployment.
      # Both layouts must ship: the desktop page links to mobile.html, and the
      # mobile page links back to declinationes.html.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp dist/declinationes.html _site/index.html
          cp dist/declinationes.html _site/declinationes.html
          cp dist/mobile.html _site/mobile.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
